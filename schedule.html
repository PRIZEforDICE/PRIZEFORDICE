let shown=new Date(2026,10,1),selected='2026-11-27';const months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];const pad=n=>String(n).padStart(2,'0');const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;function renderDetails(){const d=new Date(`${selected}T12:00:00`),list=events[selected]||[];let html=`<div class="detail-heading"><div class="date-badge">${pad(d.getDate())}<small>${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'][d.getDay()]}</small></div><div><h2>${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}</h2><span>${list.length?`มี ${list.length} รายการ`:''}</span></div></div>`;html+=list.length?list.map(e=>`<article class="event"><h3>${e.name}</h3><p><b>เวลา:</b> ${e.time}</p><p><b>สถานที่:</b> ${e.venue}</p><p><b>รายละเอียด / รับชม:</b> ${e.detail}</p><span class="artist">${e.artist}</span></article>`).join(''):'<div class="empty">🎲<br>วันนี้ยังไม่มีตารางงาน<br><small>เลือกวันที่มีจุดสีม่วงเพื่อดูรายละเอียด</small></div>';document.getElementById('details').innerHTML=html}function renderCalendar(){const y=shown.getFullYear(),m=shown.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),prevCount=new Date(y,m,0).getDate();document.getElementById('monthTitle').textContent=`${months[m]} ${y+543}`;let html='';for(let i=0;i<42;i++){let day,month=m,year=y,out=false;if(i<first){day=prevCount-first+i+1;month=m-1;out=true}else if(i>=first+count){day=i-first-count+1;month=m+1;out=true}else day=i-first+1;if(month<0){month=11;year--}if(month>11){month=0;year++}const date=key(year,month,day),classes=['day'];if(out)classes.push('outside');if(events[date])classes.push('has-event');if(date===selected)classes.push('selected');if(date==='2026-11-27')classes.push('today');html+=`<button class="${classes.join(' ')}" data-date="${date}" aria-label="${day} ${months[month]}${events[date]?', มีงาน':''}" aria-pressed="${date===selected}">${day}</button>`}document.getElementById('days').innerHTML=html;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;const [yy,mm]=selected.split('-').map(Number);shown=new Date(yy,mm-1,1);renderCalendar()});renderDetails()}document.getElementById('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);renderCalendar()};document.getElementById('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);renderCalendar()};renderCalendar();
